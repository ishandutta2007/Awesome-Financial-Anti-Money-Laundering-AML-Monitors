<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#05101e" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#11998e" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2a4a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0b1728" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 18px;
      fill: #94a3b8;
    }
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38ef7d;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.08); }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes scanline {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pingNode {
      0% { r: 4; opacity: 0.9; }
      50% { r: 9; opacity: 0.3; }
      100% { r: 4; opacity: 0.9; }
    }

    .ambient-glow {
      transform-origin: center;
      animation: pulseGlow 6s ease-in-out infinite;
    }
    .floating-card-1 {
      animation: floatPill 5s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: floatPill 6s ease-in-out 1s infinite;
    }
    .floating-card-3 {
      animation: floatPill 5.5s ease-in-out 2s infinite;
    }
    .pulse-node {
      animation: pingNode 2.5s ease-in-out infinite;
    }
    .network-line {
      stroke-dasharray: 8, 4;
      animation: scanline 15s linear infinite;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Background Grid -->
  <g opacity="0.07" stroke="#00f2fe" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Ambient Dynamic Glow Orbs in Background -->
  <circle class="ambient-glow" cx="1020" cy="120" r="140" fill="#00f2fe" opacity="0.15" filter="url(#glow)" />
  <circle class="ambient-glow" cx="180" cy="280" r="100" fill="#38ef7d" opacity="0.1" filter="url(#glow)" />

  <!-- Dynamic Background Network Graph (Visualizing Transaction Tracing / Topology) -->
  <g class="network-line" stroke="#38bdf8" stroke-width="1.5" opacity="0.35">
    <line x1="880" y1="70" x2="980" y2="120" />
    <line x1="980" y1="120" x2="1090" y2="80" />
    <line x1="980" y1="120" x2="950" y2="220" />
    <line x1="950" y1="220" x2="1080" y2="210" />
    <line x1="1080" y1="210" x2="1140" y2="150" />
    <line x1="1090" y1="80" x2="1140" y2="150" />
  </g>

  <!-- Network Graph Nodes -->
  <g opacity="0.85">
    <circle cx="880" cy="70" r="5" fill="#38ef7d" filter="url(#soft-glow)" />
    <circle cx="980" cy="120" r="7" fill="#00f2fe" filter="url(#soft-glow)" />
    <circle class="pulse-node" cx="980" cy="120" r="7" fill="#00f2fe" />
    <circle cx="1090" cy="80" r="5" fill="#38bdf8" />
    <circle cx="950" cy="220" r="6" fill="#f59e0b" filter="url(#soft-glow)" />
    <circle cx="1080" cy="210" r="6" fill="#38ef7d" />
    <circle cx="1140" cy="150" r="5" fill="#ef4444" filter="url(#soft-glow)" />
  </g>

  <!-- Dynamic Interactive-style Pills / Badges in Top Right -->
  <g class="floating-card-1" transform="translate(860, 42)">
    <rect width="180" height="34" rx="17" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.2" filter="url(#soft-glow)" />
    <circle cx="18" cy="17" r="4.5" fill="#38ef7d" />
    <text x="32" y="22" class="pill-text">Real-Time Screening</text>
  </g>

  <g class="floating-card-2" transform="translate(970, 240)">
    <rect width="195" height="34" rx="17" fill="url(#card-grad)" stroke="#38ef7d" stroke-width="1.2" filter="url(#soft-glow)" />
    <circle cx="18" cy="17" r="4.5" fill="#00f2fe" />
    <text x="32" y="22" class="pill-text">AI Network Forensics</text>
  </g>

  <g class="floating-card-3" transform="translate(820, 285)">
    <rect width="170" height="34" rx="17" fill="url(#card-grad)" stroke="#818cf8" stroke-width="1.2" />
    <circle cx="18" cy="17" r="4.5" fill="#818cf8" />
    <text x="32" y="22" class="pill-text">FATF &amp; FinCEN Rules</text>
  </g>

  <!-- FOREGROUND: Header Pill / Tag -->
  <g transform="translate(70, 50)">
    <rect width="250" height="32" rx="16" fill="#132337" stroke="#38ef7d" stroke-width="1.2" />
    <circle cx="16" cy="16" r="4.5" fill="#38ef7d" />
    <text x="30" y="21" class="badge-label">&#9889; REAL-TIME AML COMPLIANCE</text>
  </g>

  <!-- FOREGROUND: Main Title -->
  <text x="70" y="140" class="title-text">
    Awesome Financial AML Monitors
  </text>

  <!-- FOREGROUND: Gradient Accent Bar -->
  <rect x="70" y="160" width="220" height="4" rx="2" fill="url(#primary-grad)" />

  <!-- FOREGROUND: Subtitle & Meta -->
  <text x="70" y="205" class="subtitle-text">
    Curated SaaS Platforms &amp; Open-Source Engines for Anti-Money Laundering
  </text>
  <text x="70" y="235" class="subtitle-text" fill="#64748b" font-size="15px">
    Transaction Monitoring &#8226; Sanctions/PEP Screening &#8226; Typology Detection &#8226; Graph Forensics
  </text>

  <!-- FOREGROUND: Metric Badges / Chips -->
  <g transform="translate(70, 275)">
    <!-- Chip 1: ISO 20022 -->
    <rect width="125" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="14" y="20" font-family="-apple-system, sans-serif" font-size="12px" font-weight="600" fill="#cbd5e1">&#127974; ISO 20022</text>

    <!-- Chip 2: Open Source & SaaS -->
    <rect x="135" width="145" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="149" y="20" font-family="-apple-system, sans-serif" font-size="12px" font-weight="600" fill="#cbd5e1">&#128640; SaaS + Self-Hosted</text>

    <!-- Chip 3: AI-Driven -->
    <rect x="290" width="125" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="304" y="20" font-family="-apple-system, sans-serif" font-size="12px" font-weight="600" fill="#cbd5e1">&#129302; AI Forensics</text>

    <!-- Chip 4: Multi-Chain KYT -->
    <rect x="425" width="140" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="439" y="20" font-family="-apple-system, sans-serif" font-size="12px" font-weight="600" fill="#cbd5e1">&#9937; On-Chain KYT</text>
  </g>
</svg>
